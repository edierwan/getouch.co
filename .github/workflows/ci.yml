# SERAPOD-INFRA-GOV-001 — automated checks. This workflow never deploys:
# production deploys stay manual in Coolify, and only commits with green checks should be deployed.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, type-check, build, documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes tests/docs-governance.test.mjs (tracker structure + public-repo safety scan).
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
